# Roda o piloto automático de hora em hora, das 08h às 22h de Brasília (UTC-3). O GitHub costuma pular
# ou atrasar horários agendados; rodando toda hora, cada post sai na primeira rodada depois do horário dele.
# Nada pessoal fica aberto no repositório: o estado vai criptografado em state.enc (chave STATE_KEY),
# guardado como anexo da release "estado" (não no git, para o repositório não inchar a cada rodada),
# e só sobem em claro, na pasta media/, os arquivos no momento em que são publicados no Instagram.
name: autopost
on:
  schedule:
    - cron: "17 0,1,11-23 * * *"   # de hora em hora, 08:17 às 22:17 BRT
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: autopost
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      STATE_KEY: ${{ secrets.STATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
      ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
      ONEDRIVE_KEY: ${{ secrets.ONEDRIVE_KEY }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: confere a configuração
        run: |
          if [ -z "$STATE_KEY" ]; then echo "Falta o segredo STATE_KEY; nada a fazer ainda."; exit 0; fi
      - uses: actions/checkout@v4
        if: env.STATE_KEY != ''
      - uses: actions/setup-python@v5
        if: env.STATE_KEY != ''
        with: {python-version: "3.12", cache: pip}
      - if: env.STATE_KEY != ''
        run: sudo apt-get install -y ffmpeg fonts-inter && pip install -r requirements.txt
      - name: cópias do OneDrive já baixadas
        if: env.STATE_KEY != ''
        uses: actions/cache@v4
        with:
          path: |
            data/cache/od_*
            data/cache/site_*
          key: od-${{ github.run_id }}
          restore-keys: od-
      - name: modelos de fala e voz já baixados
        if: env.STATE_KEY != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ github.run_id }}
          restore-keys: hf-
      - if: env.STATE_KEY != ''
        run: |
          # estado: a release "estado" é a fonte; o state.enc antigo do git só vale enquanto ela não existir
          if gh release view estado >/dev/null 2>&1; then
            gh release download estado -p state.enc --clobber
          fi
          python -m autopost.state unpack
          # narração com a sua voz: só instala o motor se houver amostra em data/voz/
          if ls data/voz/* >/dev/null 2>&1; then
            pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts || echo "motor de voz indisponível"
          fi
          # se a rodada falhar, o estado (curadoria já paga, posts publicados) é salvo mesmo assim
          python -m autopost run || echo "falhou=1" >> "$GITHUB_ENV"
          find output -mindepth 1 -maxdepth 1 -type d -mtime +10 -exec rm -rf {} + || true
          python -m autopost.state pack
      - name: guarda o estado criptografado
        if: env.STATE_KEY != ''
        run: |
          gh release view estado >/dev/null 2>&1 || gh release create estado --title "estado (criptografado)" \
            --notes "Estado do piloto automático, criptografado com a STATE_KEY. Não apague: sem ele o sistema esquece o que já publicou."
          gh release upload estado state.enc --clobber
      - name: avisa se a rodada falhou
        if: env.falhou == '1'
        run: exit 1
