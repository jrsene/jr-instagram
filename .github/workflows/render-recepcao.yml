# Teste manual: folhas com fotos de recepção de todos os álbuns da galeria, para o dono escolher.
# Não publica nada e não monta reel. Usa a galeria em modo público, sem segredos.
name: render-recepcao
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  recepcao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: dependências de produção
        run: pip install -r requirements.txt
      - name: monta as folhas de recepção
        run: python tests/render_reel/recepcao_galeria.py "$RUNNER_TEMP/recepcao"
      - name: guarda as folhas no branch (só para o dono ver)
        run: |
          mkdir -p previas && cp "$RUNNER_TEMP"/recepcao/recepcao_*.jpg previas/ 2>/dev/null || exit 0
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previas/
          git commit -m "folhas de recepção da galeria" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
