# Teste manual: monta um reel só com fotos da galeria do site e guarda o resultado como artefato.
# Não publica nada no Instagram e não usa segredos (a galeria é lida em modo público).
name: render-galeria
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  galeria:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg e fontes
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: dependências de produção
        run: pip install -r requirements.txt
      - name: monta o reel com fotos da galeria
        run: |
          python tests/render_reel/duas_por_album.py "$RUNNER_TEMP/galeria"
          python tests/render_reel/recepcao_galeria.py "$RUNNER_TEMP/recepcao"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-duas-por-album
          path: ${{ runner.temp }}/galeria
      - name: guarda a folha de conferência no branch (só para o dono ver)
        if: always()
        run: |
          mkdir -p previas && cp "$RUNNER_TEMP"/recepcao/recepcao_*.jpg previas/ 2>/dev/null || true
          test -f "$RUNNER_TEMP/galeria/conferencia.jpg" || exit 0
          mkdir -p previas && cp "$RUNNER_TEMP/galeria/conferencia.jpg" previas/conferencia.jpg
          test -f "$RUNNER_TEMP/galeria/piscina.jpg" && cp "$RUNNER_TEMP/galeria/piscina.jpg" previas/piscina.jpg || true
          test -f "$RUNNER_TEMP/galeria/juana.jpg" && cp "$RUNNER_TEMP/galeria/juana.jpg" previas/juana.jpg || true
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previas/
          git commit -m "conferência das fotos do reel" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
